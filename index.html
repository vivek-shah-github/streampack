<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Pack Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Chakra+Petch:wght@600&family=Saira+Condensed:wght@800&family=Teko:wght@600&family=Pixelify+Sans:wght@700&family=Russo+One&family=Anton&family=Bungee&family=Orbitron:wght@800&family=Fredoka:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --ink: #1c1f24; --panel: #24282e; --raise: #2d3239; --line: #3c424c; --line2: #4c5460;
  --text: #eef0f2; --muted: #a3abb6; --tally: #ff4b3e; --tally-dim: rgba(255,75,62,.16); --focus: #79b6ff;
  --f: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 15px/1.45 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 20px; padding: 18px clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; font-stretch: 125%; letter-spacing: -.01em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-stretch: 90%; }
.brand p b { color: var(--text); font-weight: 600; }
.btn { appearance: none; border: 1px solid var(--line2); background: var(--raise); border-radius: 6px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-stretch: 95%; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 700; padding: 11px 18px; }
.btn.primary:hover { background: #fff; }
.btn.primary[disabled] { opacity: .6; cursor: progress; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.plain { background: transparent; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 460px; align-items: start; }
.stagecol { position: sticky; top: 0; padding: 24px clamp(16px, 3vw, 36px); min-width: 0; }
.formcol { border-left: 1px solid var(--line); background: var(--panel); min-height: calc(100vh - 80px); }
@media (max-width: 1060px) {
  .app { grid-template-columns: 1fr; }
  .stagecol { position: static; }
  .formcol { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- monitor ---------- */
.mon-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; font-stretch: 90%; }
.tally { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--tally); }
.tally::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 0 3px var(--tally-dim); }
.mon-head .res { color: var(--muted); font-variant-numeric: tabular-nums; }
.mon-head .file { margin-left: auto; color: var(--muted); font-size: 13px; }
.monitor-wrap { display: flex; justify-content: center; }
.monitor { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0a0b0d; outline: 3px solid var(--tally); outline-offset: 0; overflow: hidden; }
.monitor.vert { width: auto; height: min(74vh, 900px); aspect-ratio: 9 / 16; }
@media (max-width: 1060px) { .monitor.vert { height: min(80vh, 760px); } }
.monitor iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
.ghost { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.ghost .feed { position: absolute; inset: 0;
  background: linear-gradient(180deg, #6d8aa6 0%, #a9c0cc 44%, #7d8a57 45%, #59663a 70%, #3b4526 100%); }

.ghost .hole { position: absolute; display: grid; place-items: center; overflow: hidden; }
.ghost .hole.cam { background: radial-gradient(circle at 50% 35%, #56606e, #23282f 75%); }
.ghost .hole.cam svg { width: 46%; height: auto; fill: #7c8794; opacity: .55; margin-top: 18%; }
.ghost .hole.game { background: linear-gradient(180deg, #6d8aa6 0%, #a9c0cc 50%, #6c7a48 51%, #3b4526 100%); }
.ghost .lbl { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font: 600 26px var(--f); color: rgba(255,255,255,.75); background: rgba(0,0,0,.35); padding: 4px 12px; white-space: nowrap; }
.ghost .chat { position: absolute; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 6px; gap: 8px; overflow: hidden; }
.ghost .msg { background: rgba(0,0,0,.72); border-left: 4px solid var(--acc, #fff); padding: 10px 14px; }
.ghost .msg b { display: block; font-size: 18px; color: var(--acc, #fff); }
.ghost .msg span { font-size: 22px; color: var(--txt, #fff); }

.switcher { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.key { appearance: none; border: 1px solid var(--line2); background: var(--raise); color: var(--text); border-radius: 4px; padding: 10px 14px;
  font-weight: 700; font-stretch: 85%; cursor: pointer; min-width: 92px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.key:hover { border-color: var(--muted); }
.key[aria-pressed="true"] { background: var(--tally); border-color: var(--tally); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; font-stretch: 92%; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.switcher .seg { margin-left: auto; }
.alerts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
.alerts span { margin-right: 4px; font-stretch: 90%; }

/* ---------- form ---------- */
.intro { padding: 22px 24px 6px; }
.intro details { border: 1px solid var(--line); border-radius: 8px; background: var(--raise); }
.intro summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-stretch: 105%; }
.intro .how { padding: 0 16px 14px; color: var(--muted); }
.intro .how p { margin: 0 0 10px; max-width: 62ch; }
.intro .how b { color: var(--text); font-weight: 600; }
section.grp { padding: 20px 24px 24px; border-bottom: 1px solid var(--line); }
section.grp h2 { margin: 0 0 4px; font-size: 21px; font-weight: 750; font-stretch: 112%; letter-spacing: -.005em; }
section.grp > p.hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; max-width: 58ch; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); font-stretch: 92%; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
input[type=text], input[type=number], input[type=password], textarea, select {
  width: 100%; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 9px 11px; min-width: 0; }
input:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 2px rgba(121,182,255,.25); }
textarea { resize: vertical; min-height: 92px; line-height: 1.45; }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--tally); }
.small-note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; max-width: 58ch; }
.warn { font-size: 13px; color: #ffd6a0; background: rgba(255,170,60,.09); border: 1px solid rgba(255,170,60,.3); border-radius: 6px; padding: 10px 12px; margin: 4px 0 14px; }

.themes { display: grid; gap: 8px; margin-bottom: 18px; }
.theme { appearance: none; text-align: left; display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; cursor: pointer; }
.theme:hover { border-color: var(--muted); }
.theme[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.theme .sw { width: 54px; height: 54px; border-radius: 6px; position: relative; overflow: hidden; }
.theme .sw i { position: absolute; }
.theme strong { display: block; font-weight: 700; font-stretch: 105%; }
.theme small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }

.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.color { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 6px; }
.color input[type=color] { width: 34px; height: 34px; border: 0; padding: 0; background: none; border-radius: 4px; cursor: pointer; }
.color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color input[type=color]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,.2); border-radius: 4px; }
.color div { min-width: 0; }
.color b { display: block; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.color input[type=text] { padding: 2px 0; border: 0; background: transparent; font-size: 13px; font-variant-numeric: tabular-nums; }
.color input[type=text]:focus { box-shadow: none; }
@media (max-width: 480px) { .colors { grid-template-columns: 1fr 1fr; } }

.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.font { appearance: none; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 10px; cursor: pointer; text-align: left; }
.font[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.font .s { display: block; font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
.font small { color: var(--muted); font-size: 12px; }

.logo-drop { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: var(--ink); border: 1px dashed var(--line2); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.logo-drop .thumb { width: 96px; height: 60px; display: grid; place-items: center; border-radius: 4px; background: #000 repeating-conic-gradient(#1a1a1a 0 25%, #222 0 50%) 0 0/12px 12px; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; }
.logo-drop .thumb img { max-width: 100%; max-height: 100%; }
.logo-drop .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.logo-drop p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

.list { display: grid; gap: 8px; margin-bottom: 10px; }
.li { display: grid; grid-template-columns: 1fr 1.3fr auto auto; gap: 6px; align-items: center; }
.li.sp { grid-template-columns: 22px 1.4fr 1fr; }
.li .n { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.icon-btn { appearance: none; border: 1px solid var(--line2); background: transparent; border-radius: 6px; width: 34px; height: 36px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--text); border-color: var(--muted); }
.star[aria-pressed="true"] { color: #ffc94a; border-color: #ffc94a; }
.corners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 280px; margin-bottom: 14px; }
.corners button { appearance: none; border: 1px solid var(--line2); background: var(--ink); border-radius: 6px; padding: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.corners button[aria-pressed="true"] { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.endbar { padding: 24px; display: grid; gap: 12px; }
.endbar .btn.primary { width: 100%; padding: 14px; font-size: 16px; }
.top .status { max-width: 320px; text-align: right; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.status.ok { color: #8fe3a8; } .status.err { color: #ffb4a8; }
/* tabs */
.tabs { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 0 2px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--muted); padding: 9px 9px 11px; font-weight: 650; font-stretch: 92%; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tally); }
.panel[hidden] { display: none; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin-bottom: 16px; }
.opts.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 420px) { .opts.four { grid-template-columns: 1fr 1fr; } }
.opts.two { grid-template-columns: 1fr 1fr; max-width: 300px; }
.opts button { appearance: none; border: 1px solid var(--line2); background: var(--ink); border-radius: 6px; padding: 9px 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); text-align: center; }
.opts button:hover { color: var(--text); }
.opts button[aria-pressed="true"] { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.opts button small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.range { display: grid; grid-template-columns: 1fr 52px; gap: 12px; align-items: center; margin-bottom: 14px; }
.range input { accent-color: var(--tally); width: 100%; }
.range output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }
.toolrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.media { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: var(--ink); border: 1px dashed var(--line2); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.media .thumb { width: 96px; height: 54px; border-radius: 4px; background: #000 center/cover; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.media p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
h3.sub { margin: 18px 0 8px; font-size: 15px; font-weight: 700; font-stretch: 105%; }
.foot { padding: 0 24px 28px; color: var(--muted); font-size: 13px; }
.only-yt, .only-tw { }
body.tw .only-yt, body.yt .only-tw { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="yt">
<header class="top">
  <div class="brand">
    <h1>Stream Pack Builder</h1>
    <p>Design your own OBS overlays and scenes, then download them ready to use. Built on the system <b>SHAHZON</b> uses on his own streams.</p>
  </div>
  <span class="status" id="status-top" role="status" aria-live="polite"></span>
  <button class="btn primary" id="dl-top" type="button">Download my pack</button>
</header>

<main class="app">
  <div class="stagecol">
    <div class="mon-head"><span class="tally">Preview</span><span class="res" id="res">1920 × 1080</span><span class="file" id="file">starting.html</span></div>
    <div class="monitor-wrap"><div class="monitor" id="monitor">
      <div class="ghost" id="under"></div>
      <iframe id="pv" title="Scene preview" sandbox="allow-scripts"></iframe>
      <div class="ghost" id="over"></div>
    </div></div>
    <div class="switcher" id="keys" role="group" aria-label="Scenes"></div>
    <div class="alerts">
      <span>Test an alert:</span>
      <button class="btn small" data-alert="sub" id="a-sub">New subscriber</button>
      <button class="btn small" data-alert="member" id="a-mem">Member</button>
      <button class="btn small" data-alert="superchat" id="a-sc">Super Chat</button>
      <button class="btn small" data-alert="tip">Tip</button>
      <button class="btn small" data-alert="raid">Raid</button>
    </div>
  </div>

  <div class="formcol" id="form"></div>
</main>
<script>
const SYNTH = "/* alert sounds, made in code: no audio files needed */\nfunction packSound(kind, vol) {\n  try {\n    const AC = window.AudioContext || window.webkitAudioContext;\n    const ac = packSound.ac || (packSound.ac = new AC());\n    if (ac.state === \"suspended\") ac.resume();\n    const t0 = ac.currentTime + .03, out = ac.createGain();\n    out.gain.value = vol == null ? .6 : vol; out.connect(ac.destination);\n    const tone = (f, st, dur, type, g, f2) => {\n      const o = ac.createOscillator(), e = ac.createGain();\n      o.type = type || \"sine\"; o.frequency.setValueAtTime(f, t0 + st);\n      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + st + dur);\n      e.gain.setValueAtTime(0, t0 + st); e.gain.linearRampToValueAtTime(g || .4, t0 + st + .01);\n      e.gain.exponentialRampToValueAtTime(.001, t0 + st + dur);\n      o.connect(e); e.connect(out); o.start(t0 + st); o.stop(t0 + st + dur + .05);\n    };\n    const S = {\n      chime:   () => { tone(880, 0, .6, \"sine\", .4); tone(1318.5, .12, .9, \"sine\", .35); },\n      coin:    () => { tone(988, 0, .08, \"square\", .16); tone(1319, .08, .45, \"square\", .16); },\n      levelup: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .25, \"triangle\", .3)); tone(1568, .36, .7, \"triangle\", .25); },\n      drop:    () => { tone(220, 0, 1, \"sawtooth\", .25, 40); tone(70, 0, 1.2, \"sine\", .7, 32); },\n      laser:   () => { tone(1800, 0, .35, \"sawtooth\", .18, 120); tone(1200, .12, .3, \"square\", .08, 90); },\n      bell:    () => { [1, 2.76, 5.4].forEach((m, i) => tone(660 * m, 0, 1.8 / (i + 1), \"sine\", .32 / (i + 1))); }\n    };\n    (S[kind] || S.chime)();\n  } catch (e) {}\n}\n";

const hexRgb = h => { h = (h || "#000").replace("#", ""); if (h.length === 3) h = [...h].map(c => c + c).join(""); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const onColor = h => lum(h) > .32 ? "#000000" : "#ffffff";
const darken = (h, k) => "#" + hexRgb(h).map(v => Math.round(v * k).toString(16).padStart(2, "0")).join("");
const js = v => JSON.stringify(v, null, 2).replace(/</g, "\\u003c");
const jsl = v => JSON.stringify(v).replace(/</g, "\\u003c");
const lit = o => "{ " + Object.entries(o).map(([k, v]) => `${k}: ${jsl(v)}`).join(", ") + " }";
const litList = a => a.length ? "[\n" + a.map(o => "    " + lit(o)).join(",\n") + "\n  ]" : "[]";
const strList = a => a.length ? "[\n" + a.map(v => "    " + jsl(v)).join(",\n") + "\n  ]" : "[]";
const litBlock = o => "{\n" + Object.entries(o).map(([k, v]) => `    ${k}: ${jsl(v)}`).join(",\n") + "\n  }";
const alertCfg = (S, preview) => {
  const a = S.alerts, o = { style: a.style, position: a.position, seconds: Number(a.seconds) || 5, sound: a.sound, volume: Number(a.volume) };
  if (a.sound === "custom") o.soundFile = a.soundData ? (preview ? "" : "assets/alert." + soundExt(a.soundType)) : "";
  return o;
};
const soundExt = t => ({ "audio/mpeg": "mp3", "audio/mp3": "mp3", "audio/wav": "wav", "audio/x-wav": "wav", "audio/ogg": "ogg", "audio/webm": "webm" }[t] || "mp3");
const dataBytes = d => { const b = atob((d || "").split(",")[1] || ""), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const escH = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => (String(s || "my").normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "") || "My");
const logoExt = type => ({ "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg" }[type] || "png");

<ol>

  <li>For each scene: Sources › + › <b>Browser</b> › tick <b>Local file</b> › pick the HTML file. Horizontal files use <code>1920 × 1080</code>; <code>v-</code> files use <code>1080 × 1920</code>.</li>

<\/script>

=====================

1. Unzip this folder somewhere it will stay (e.g. Documents). Keep the files together.
2. Open index.html in your browser to see every scene and the full OBS setup steps.
3. In OBS, add each scene as a Browser source › Local file.
4. Your details: assets/config.js   Your colours: top of assets/pack.css
5. While live, edit only assets/live.js (rank, supporters, goal). It updates on screen by itself.

${S.youtubeApiKey || S.streamlabsSocketToken ? "This copy contains your private keys in assets/config.js. Don't share it.\n" : "To share this pack with a friend, send it as it is: no private keys are inside.\n"}
Made with the Stream Pack Builder by SHAHZON.
`;
}

function buildFiles(S) {
  const files = {};
  for (const [name, html] of Object.entries(SCENE_FILES)) files[name] = html;
  files["index.html"] = indexHTML(S);
  files["README.txt"] = readme(S);
  files["assets/config.js"] = configJS(S, false);
  files["assets/live.js"] = liveJS(S);
  files["assets/pack.js"] = PACK_JS;
  files["assets/pack.css"] = packCSS(S);
  files["assets/chat.css"] = chatCSS(S);
  if (S.logo) files[`assets/logo.${logoExt(S.logoType)}`] = dataBytes(S.logo);
  if (S.background) files["assets/background.jpg"] = dataBytes(S.background);
  if (S.alerts.sound === "custom" && S.alerts.soundData) files[`assets/alert.${soundExt(S.alerts.soundType)}`] = dataBytes(S.alerts.soundData);
  return files;
}

/* preview: one scene as a self-contained document */
function previewDoc(S, file) {
  return SCENE_FILES[file]
    .replace('<link rel="stylesheet" href="assets/pack.css">', () => `<style>${packCSS(S)}</style>`)
    .replace('<script src="assets/config.js"><\/script>', () => `<script>window.PACK_PREVIEW=true;\n${configJS(S, true)}\n${liveJS(S)}<\/script>`)
    .replace('<script src="assets/pack.js"><\/script>', () => `<script>${PACK_JS}<\/script>`);
}

        <button type="button" class="btn small" id="reset-words">Reset words to the style's defaults</button>
      </section>
    </div>

    <div class="panel" data-panel="live">
      <section class="grp">
        <h2>While you're live</h2>
        <p class="hint">These go into <b>live.js</b>, the file you edit during a stream. Set them here to see how they look.</p>
        ${T("live.rank", "Rank (empty hides the box)", "4210")}
        <div class="field"><span>Top supporters (empty name skips a slot)</span></div>
        <div class="list" id="supporters"></div>
        <label class="check"><input type="checkbox" data-k="live.goal.on"><span>Show a goal card</span></label>
        <div class="row3">${T("live.goal.label", "Goal", "New mic")}
          <label class="field"><span>Raised</span><input type="number" min="0" data-k="live.goal.current"></label>
          <label class="field"><span>Target</span><input type="number" min="0" data-k="live.goal.target"></label></div>
        <div class="row">${T("currency", "Currency symbol", "₹")}
          <label class="field"><span>Number style</span><select data-k="locale"><option value="en-IN">1,00,000 (India)</option><option value="en-US">100,000</option><option value="de-DE">100.000</option></select></label></div>
      </section>
    </div>

    <div class="panel" data-panel="setup">
      <section class="grp">
        <h2>Automation (optional)</h2>
        <p class="hint">Skip this now if you like. You can paste these into config.js later.</p>
        <div class="only-yt">
          <label class="check"><input type="checkbox" data-k="counters"><span>Show live viewers, likes and subscribers. Needs a free YouTube Data API v3 key from Google Cloud Console.</span></label>
          <div class="row">${T("youtubeApiKey", "YouTube API key", "AIza…", 'autocomplete="off" spellcheck="false"')}${T("channelId", "Channel ID", "UC…", 'spellcheck="false"')}</div>
        </div>
        ${T("streamlabsSocketToken", "Streamlabs Socket API token (for alerts)", "From Streamlabs › Settings › API Settings", 'autocomplete="off" spellcheck="false"')}
        <p class="warn">Keys and tokens are private. They aren't saved in this page or in settings files, only written into your pack download. Once they're in your pack, don't share the folder or post config.js anywhere.</p>
      </section>
      <section class="grp">
        <h2>Save and share your look</h2>
        <p class="hint">Save your settings as a file to keep a backup, switch between looks, or give your style to a friend. Keys and tokens are never included.</p>
        <div class="toolrow">
          <button type="button" class="btn small" id="preset-save">Save settings file</button>
          <label class="btn small" for="preset-in" tabindex="0">Load settings file</label>
        </div>
        <input type="file" id="preset-in" accept="application/json,.json" hidden>
        <button class="btn small plain" id="reset-all" type="button">Start over</button>
      </section>
    </div>

    <div class="endbar">
      <button class="btn primary" id="dl-bottom" type="button">Download my pack</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <p class="foot">Made by SHAHZON for fellow streamers. Share this page with anyone who wants their own pack.</p>`;
    bind();
    showTab(ui.tab, false);
    sync();
  }

  function showTab(k, jump) {
    ui.tab = k;
    $$("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === k));
    $$("[data-panel]").forEach(p => p.hidden = p.dataset.panel !== k);
    if (!jump) return;
    const full = ["starting", "brb", "ending", "tech"].includes(ui.scene);
    if (k === "alerts" && full) { ui.scene = "gameplay"; renderKeys(); refresh(true); }
    if (k === "effects" && !full) { ui.scene = "starting"; renderKeys(); refresh(true); }
    const tabs = $(".tabs"); if (tabs.getBoundingClientRect().top < 0) tabs.scrollIntoView({ block: "start" });
  }

  function sync() {
    $$("[data-k]").forEach(el => {
      const v = get(el.dataset.k);
      if (el.type === "checkbox") el.checked = !!v;
      else if (el.tagName === "TEXTAREA") el.value = (v || []).join("\n");
      else if (document.activeElement !== el) el.value = v ?? "";
    });
    $$("[data-out]").forEach(o => o.textContent = fmtOut(get(o.dataset.out), o.dataset.fmt));
    $$("[data-group]").forEach(g => { const v = String(get(g.dataset.group)); $$("button", g).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); });
    $$("[data-color]").forEach(el => el.value = S.colors[el.dataset.color]);
    $$("[data-hex]").forEach(el => { if (document.activeElement !== el) el.value = S.colors[el.dataset.hex]; });
    $$("#themes [data-theme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === S.theme));
    const tw = S.platform === "twitch";
    document.body.classList.toggle("tw", tw); document.body.classList.toggle("yt", !tw);
    $("#a-sub").textContent = tw ? "New follower" : "New subscriber";
    $("#a-mem").textContent = tw ? "Subscriber" : "Member";
    $("#a-sc").textContent = tw ? "Bits" : "Super Chat";
    $("#thumb").innerHTML = S.logo ? `<img src="${S.logo}" alt="Your logo">` : "No logo";
    $("#bg-thumb").style.backgroundImage = S.background ? `url("${S.background}")` : "";
    $("#bg-thumb").textContent = S.background ? "" : "None";
    $("#snd-custom").hidden = S.alerts.sound !== "custom";
    $("#snd-thumb").textContent = S.alerts.soundData ? "✓" : "♪";
    $("[data-k='startingMinutes']").disabled = S.startMode === "clock";
    $("[data-k='startAt']").disabled = S.startMode !== "clock";
    renderLists();
  }

  function renderLists() {
    $("#socials").innerHTML = S.socials.map((s, i) => `
      <div class="li"><input type="text" value="${escH(s.label)}" data-sl="${i}" placeholder="LABEL" aria-label="Ticker label ${i + 1}">
        <input type="text" value="${escH(s.value)}" data-sv="${i}" placeholder="value" aria-label="Ticker value ${i + 1}">
        <button type="button" class="icon-btn star" data-sh="${i}" aria-pressed="${!!s.highlight}" title="Highlight in the money colour" aria-label="Highlight line ${i + 1}">★</button>
        <button type="button" class="icon-btn" data-sx="${i}" title="Remove" aria-label="Remove line ${i + 1}">×</button></div>`).join("");
    $("#supporters").innerHTML = S.live.supporters.map((s, i) => `
      <div class="li sp"><span class="n">#${i + 1}</span><input type="text" value="${escH(s.name)}" data-pn="${i}" placeholder="Name" aria-label="Supporter ${i + 1} name">
        <input type="text" value="${escH(s.amount)}" data-pa="${i}" placeholder="${escH(S.currency)}500" aria-label="Supporter ${i + 1} amount"></div>`).join("");
  }

  const touchable = k => k.startsWith("words.") || k === "gameIdLabel" || k === "rankLabel";
  function readFile(file, max, cb) {
    if (!file) return;
    if (file.size > max) { status(`That file is over ${Math.round(max / 1e6)} MB. Please use a smaller one.`, "err"); return; }
    const r = new FileReader(); r.onload = () => cb(r.result, file.type); r.readAsDataURL(file);
  }
  async function shrinkImage(src) {
    const img = new Image(); img.src = src; await img.decode();
    const k = Math.min(1, 1920 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .85);
  }

  function bind() {
    const F = $("#form");
    F.addEventListener("input", e => {
      const el = e.target;
      if (el.dataset.k) {
        const k = el.dataset.k;
        let v = el.type === "checkbox" ? el.checked : el.tagName === "TEXTAREA" ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value;
        if (el.type === "number" || el.type === "range") v = el.value === "" ? "" : Number(el.value);
        set(k, v);
        if (touchable(k)) S.touched[k] = true;
        if (k === "currency") renderLists();
        if (el.type === "range") { const o = $(`[data-out="${k}"]`); if (o) o.textContent = fmtOut(v, o.dataset.fmt); }
      } else if (el.dataset.color) { S.colors[el.dataset.color] = el.value; const h = $(`[data-hex="${el.dataset.color}"]`); if (h) h.value = el.value; }
      else if (el.dataset.hex) {
        let v = el.value.trim(); if (!v.startsWith("#")) v = "#" + v;
        if (/^#[0-9a-f]{6}$/i.test(v)) { S.colors[el.dataset.hex] = v.toLowerCase(); $(`[data-color="${el.dataset.hex}"]`).value = v; } else return;
      }
      else if (el.dataset.sl) S.socials[+el.dataset.sl].label = el.value;
      else if (el.dataset.sv) S.socials[+el.dataset.sv].value = el.value;
      else if (el.dataset.pn) S.live.supporters[+el.dataset.pn].name = el.value;
      else if (el.dataset.pa) S.live.supporters[+el.dataset.pa].amount = el.value;
      else return;
      changed();
    });
    F.addEventListener("change", e => { const el = e.target; if (el.dataset.k && (el.tagName === "SELECT" || el.type === "checkbox")) { set(el.dataset.k, el.type === "checkbox" ? el.checked : el.value); changed(); } });
    F.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const grp = b.closest("[data-group]");
      if (b.dataset.tab) return showTab(b.dataset.tab, true);
      if (b.dataset.theme) applyTheme(b.dataset.theme);
      else if (grp && b.dataset.v != null) {
        const k = grp.dataset.group; set(k, parseV(b.dataset.v));
        if (k === "camPosition" || k.startsWith("cam.")) { if (ui.scene !== "gameplay" || ui.vertical) { ui.scene = "gameplay"; ui.vertical = false; renderKeys(); } }
        if (k === "chatStyle" && ui.scene !== "chatting") { ui.scene = "chatting"; renderKeys(); }
        if (k === "startMode" && ui.scene !== "starting") { ui.scene = "starting"; renderKeys(); }
        if (k === "alerts.sound") preview();
        if (k === "platform") { renderForm(); changed(); return; }
      }
      else if (b.dataset.sh) S.socials[+b.dataset.sh].highlight = !S.socials[+b.dataset.sh].highlight;
      else if (b.dataset.sx) S.socials.splice(+b.dataset.sx, 1);
      else if (b.id === "add-social") S.socials.push({ label: "", value: "", highlight: false });
      else if (b.id === "reset-words") { S.words = { ...THEMES[S.theme].words }; S.gameIdLabel = THEMES[S.theme].gameIdLabel; S.rankLabel = THEMES[S.theme].rankLabel; S.touched = {}; }
      else if (b.id === "logo-rm") { S.logo = null; S.logoType = null; $("#logo-in").value = ""; }
      else if (b.id === "bg-rm") { S.background = null; $("#bg-in").value = ""; }
      else if (b.id === "snd-rm") { S.alerts.soundData = null; S.alerts.soundType = null; $("#snd-in").value = ""; }
      else if (b.id === "snd-play") return preview();
      else if (b.id === "pal-rand") {
        const h = Math.random() * 360, mode = Math.floor(Math.random() * 3);
        S.colors = paletteFrom(h, h + [40, 180, 120][mode], [44, h + 200, 30][mode]);
        status("New colours. Press Surprise me again for another set.", "");
      }
      else if (b.id === "pal-reset") S.colors = { ...THEMES[S.theme].colors };
      else if (b.id === "pal-logo") return matchLogo();
      else if (b.id === "preset-save") return savePreset();
      else if (b.id === "dl-bottom") return download();
      else if (b.id === "reset-all") { if (!confirm("Clear everything and start from the example?")) return; S = defaultState(); try { localStorage.removeItem(KEY); } catch {} renderForm(); changed(); return; }
      else return;
      sync(); changed();
    });
    F.addEventListener("keydown", e => {
      const l = e.target.closest("label[for]"); if (l && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); $("#" + l.htmlFor).click(); }
      const t = e.target.closest("[data-tab]");
      if (t && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const i = TABS.findIndex(x => x[0] === t.dataset.tab), n = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length][0]; showTab(n, true); $(`[data-tab="${n}"]`).focus(); }
    });
    $("#logo-in").addEventListener("change", e => readFile(e.target.files[0], 8e6, (d, t) => { S.logo = d; S.logoType = t || "image/png"; sync(); changed(); }));
    $("#bg-in").addEventListener("change", e => readFile(e.target.files[0], 20e6, async d => {
      try { S.background = await shrinkImage(d); } catch { status("That image couldn't be opened. Try a JPG or PNG.", "err"); return; }
      if (!["starting", "brb", "ending", "tech"].includes(ui.scene)) { ui.scene = "starting"; renderKeys(); }
      sync(); changed();
    }));
    $("#snd-in").addEventListener("change", e => readFile(e.target.files[0], 3e6, (d, t) => { S.alerts.soundData = d; S.alerts.soundType = t || "audio/mpeg"; sync(); changed(); preview(); }));
    $("#preset-in").addEventListener("change", e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try { const v = JSON.parse(r.result); if (!v || typeof v !== "object" || !v.theme || !THEMES[v.theme]) throw 0;
          S = merge(v); renderForm(); changed(); status(`Loaded ${f.name}.`, "ok"); }
        catch { status("That file isn't a Stream Pack Builder settings file.", "err"); }
        e.target.value = "";
      };
      r.readAsText(f);
    });
  }

  function applyTheme(k) {
    const t = THEMES[k]; S.theme = k;
    S.colors = { ...t.colors }; S.font = t.font; S.sharp = t.sharp;
    S.fx = { ...S.fx, ...t.fx };
    for (const [w, v] of Object.entries(t.words)) if (!S.touched["words." + w]) S.words[w] = v;
    if (!S.touched.gameIdLabel) S.gameIdLabel = t.gameIdLabel;
    if (!S.touched.rankLabel) S.rankLabel = t.rankLabel;
  }

  async function matchLogo() {
    if (!S.logo) { status("Upload your logo first (Basics tab), then press Match my logo.", "err"); return; }
    try {
      const img = new Image(); img.src = S.logo; await img.decode();
      const c = document.createElement("canvas"), w = 80, h = Math.max(1, Math.round(80 * img.height / img.width));
      c.width = w; c.height = h; const x = c.getContext("2d"); x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h).data, B = {};
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 140) continue;
        const [hh, ss, ll] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
        if (ss < 35 || ll < 18 || ll > 88) continue;
        const k = Math.round(hh / 15) % 24; (B[k] = B[k] || { n: 0, h: 0 }); B[k].n++; B[k].h += hh;
      }
      const top = Object.entries(B).sort((a, b) => b[1].n - a[1].n).map(([k, v]) => [+k, v.h / v.n]);
      if (!top.length) { status("Your logo is mostly black, white or grey, so there's no colour to match. Try Surprise me.", "err"); return; }
      const h1 = top[0][1], second = top.find(([k]) => Math.min(Math.abs(k - top[0][0]), 24 - Math.abs(k - top[0][0])) >= 2);
      const warm = top.find(([, hh]) => hh >= 25 && hh <= 60 && Math.abs(hh - h1) > 15);
      S.colors = paletteFrom(h1, second ? second[1] : h1 + 25, warm ? warm[1] : 44);
      sync(); changed(); status("Colours matched to your logo.", "ok");
    } catch { status("Couldn't read colours from that logo.", "err"); }
  }

  /* ---------------- preview ---------------- */
  const sceneFile = () => (ui.vertical ? "v-" : "") + ui.scene + ".html";
  function renderKeys() {
    $("#keys").innerHTML = SCENES.map(s => `<button type="button" class="key" data-scene="${s.k}" aria-pressed="${s.k === ui.scene}">${s.k === "tech" ? "Tech issues" : s.t}</button>`).join("") +
      `<div class="seg" role="group" aria-label="Orientation"><button type="button" data-o="0" aria-pressed="${!ui.vertical}">Horizontal</button><button type="button" data-o="1" aria-pressed="${ui.vertical}">Vertical</button></div>`;
  }
  $("#keys").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.scene) ui.scene = b.dataset.scene; else ui.vertical = b.dataset.o === "1";
    renderKeys(); refresh(true);
  });

  let pvT;
  function changed() { save(); clearTimeout(pvT); pvT = setTimeout(() => refresh(false), 350); }

  const CAM_SVG = `<svg viewBox="0 0 100 80" aria-hidden="true"><circle cx="50" cy="26" r="20"/><path d="M8 80c4-24 22-34 42-34s38 10 42 34z"/></svg>`;
  const CHAT_LINES = [["Simran", "that clutch was insane"], ["Rohit_OP", "bhai sensitivity settings?"], ["GhostAkm", "first time here, subbed"], ["Pixel Jatt", "GG"], ["Noob Master", "one more match please"], ["Aarav", "drop your ID in chat"]];
  function ghosts() {
    const f = sceneFile(), W = ui.vertical ? 1080 : 1920, H = ui.vertical ? 1920 : 1080;
    const under = $("#under"), over = $("#over");
    [under, over].forEach(g => { g.style.width = W + "px"; g.style.height = H + "px"; });
    const holes = HOLES[f] ? HOLES[f](S) : [];
    let u = f === "gameplay.html" ? `<div class="feed"><span class="lbl">Your game capture</span></div>` : "";
    u += holes.map(([x, y, w, h, l]) => `<div class="hole ${l}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${l === "cam" ? CAM_SVG + '<span class="lbl">Your facecam</span>' : '<span class="lbl">Your game capture</span>'}</div>`).join("");
    under.innerHTML = u;
    const cr = CHAT_RECT[f], c = S.colors, [r, g, b] = hexRgb(c.acc);
    const look = {
      boxed: `background:rgba(0,0,0,.72);border-left:4px solid ${c.acc};border-radius:${S.sharp ? 0 : 8}px`,
      bubbles: `background:rgba(${r},${g},${b},.16);border:1px solid rgba(${r},${g},${b},.35);border-radius:18px 18px 18px 4px`,
      minimal: `background:transparent;text-shadow:0 2px 4px #000,0 0 2px #000`,
      neon: `background:rgba(0,0,0,.6);border:2px solid ${c.acc};box-shadow:0 0 14px rgba(${r},${g},${b},.55);border-radius:${S.sharp ? 0 : 10}px`
    }[S.chatStyle || "boxed"];
    over.style.setProperty("--acc", c.acc); over.style.setProperty("--txt", c.text);
    over.innerHTML = cr ? `<div class="chat" style="left:${cr[0]}px;top:${cr[1]}px;width:${cr[2]}px;height:${cr[3]}px;font-family:'${FONTS[S.font].ui}',sans-serif">${CHAT_LINES.map(([n, m]) => `<div class="msg" style="${look}"><b>${n}</b><span>${m}</span></div>`).join("")}</div>` : "";
    fitGhosts();
  }
  function fitGhosts() {
    const m = $("#monitor"), W = ui.vertical ? 1080 : 1920, s = m.clientWidth / W;
    $$(".ghost").forEach(g => g.style.transform = `scale(${s})`);
  }
  addEventListener("resize", fitGhosts);

  function refresh(sceneChanged) {
    const f = sceneFile();
    $("#monitor").classList.toggle("vert", ui.vertical);
    $("#res").textContent = ui.vertical ? "1080 × 1920" : "1920 × 1080";
    $("#file").textContent = f;
    ghosts();
    $("#pv").srcdoc = previewDoc(S, f);
    if (sceneChanged) requestAnimationFrame(fitGhosts);
  }
  $("#pv").addEventListener("load", () => {
    fitGhosts();
    if (ui.pendingAlert) { const a = ui.pendingAlert; ui.pendingAlert = null; setTimeout(() => fire(a), 700); }
  });

  function preview() {
    const a = S.alerts;
    if (a.sound === "none") return;
    if (a.sound === "custom") { if (!a.soundData) return; try { const au = new Audio(a.soundData); au.volume = a.volume; au.play().catch(() => {}); } catch {} return; }
    sound(a.sound, a.volume);
  }
  const NAMES = ["Rohit_OP", "Simran", "GhostAkm", "Pixel Jatt", "Noob Master"];
  function fire(type) {
    const tw = S.platform === "twitch";
    const amount = type === "superchat" ? (tw ? "500 bits" : S.currency + "199") : type === "tip" ? S.currency + "100" : "";
    const msg = type === "superchat" ? "Next game, all in!" : type === "raid" ? "42 raiders" : "";
    $("#pv").contentWindow.postMessage({ pack: "alert", type, name: NAMES[Math.floor(Math.random() * NAMES.length)], amount, msg }, "*");
    preview();
  }
  $$("[data-alert]").forEach(b => b.addEventListener("click", () => {
    const type = b.dataset.alert;
    if (ui.scene === "gameplay" || ui.scene === "chatting") return fire(type);
    ui.scene = "gameplay"; ui.pendingAlert = type; renderKeys(); refresh(true);
  }));

  /* ---------------- files out ---------------- */
  function status(t, cls) { ["#status", "#status-top"].forEach(id => { const s = $(id); if (!s) return; s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); }); }
  let dlNS;
  const dlReady = (async () => { try { if (window.claude && window.claude.use) dlNS = await window.claude.use("downloads"); } catch {} })();
  async function saveFile(filename, data) {
    await dlReady;
    if (dlNS) { await dlNS.save({ filename, data }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  async function savePreset() {
    const copy = { ...S, youtubeApiKey: "", streamlabsSocketToken: "", _builder: "stream-pack-builder", _version: 2 };
    const name = slug(S.name) + "-pack-settings.json";
    try { await saveFile(name, JSON.stringify(copy)); status(`Saved ${name}. Load it here any time to get this look back.`, "ok"); }
    catch (e) { status(e && e.code === "declined" ? "Save cancelled." : "The file didn't save. Try again in a moment.", e && e.code === "declined" ? "" : "err"); }
  }
  async function download() {
    const btns = [$("#dl-top"), $("#dl-bottom")];
    if (!window.JSZip) { status("The zip tool didn't load. Check your connection and reload the page.", "err"); return; }
    btns.forEach(b => b.disabled = true); status("Packing your files…");
    try {
      const root = slug(S.name) + "StreamPack";
      const zip = new JSZip(), files = buildFiles(S);
      for (const [p, c] of Object.entries(files)) zip.file(root + "/" + p, c);
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      const filename = root + ".zip";
      try { await saveFile(filename, blob); status(`Saved ${filename}. Unzip it and open index.html for the OBS steps.`, "ok"); }
      catch (e) { status(e && e.code === "declined" ? "Download cancelled." : "The download didn't go through. Try again in a moment.", e && e.code === "declined" ? "" : "err"); }
    } catch (e) { status("Something went wrong while packing. Reload the page and try again.", "err"); }
    btns.forEach(b => b.disabled = false);
  }
  $("#dl-top").addEventListener("click", () => { download(); });

  renderForm(); renderKeys(); refresh(true);
})();

</script>
</body></html>
