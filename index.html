<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Pack Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Chakra+Petch:wght@600&family=Saira+Condensed:wght@800&family=Teko:wght@600&family=Pixelify+Sans:wght@700&family=Russo+One&family=Anton&family=Bungee&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --ink: #1c1f24; --panel: #24282e; --raise: #2d3239; --line: #3c424c; --line2: #4c5460;
  --text: #eef0f2; --muted: #a3abb6; --tally: #ff4b3e; --tally-dim: rgba(255,75,62,.16); --focus: #79b6ff;
  --f: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 15px/1.45 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 20px; padding: 18px clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; font-stretch: 125%; letter-spacing: -.01em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-stretch: 90%; }
.brand p b { color: var(--text); font-weight: 600; }
.btn { appearance: none; border: 1px solid var(--line2); background: var(--raise); border-radius: 6px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-stretch: 95%; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 700; padding: 11px 18px; }
.btn.primary:hover { background: #fff; }
.btn.primary[disabled] { opacity: .6; cursor: progress; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.plain { background: transparent; }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 460px; align-items: start; }
.stagecol { position: sticky; top: 0; padding: 24px clamp(16px, 3vw, 36px); min-width: 0; }
.formcol { border-left: 1px solid var(--line); background: var(--panel); min-height: calc(100vh - 80px); }
@media (max-width: 1060px) {
  .app { grid-template-columns: 1fr; }
  .stagecol { position: static; }
  .formcol { border-left: 0; border-top: 1px solid var(--line); }
}

/* ---------- monitor ---------- */
.mon-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; font-stretch: 90%; }
.tally { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--tally); }
.tally::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 0 3px var(--tally-dim); }
.mon-head .res { color: var(--muted); font-variant-numeric: tabular-nums; }
.mon-head .file { margin-left: auto; color: var(--muted); font-size: 13px; }
.monitor-wrap { display: flex; justify-content: center; }
.monitor { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0a0b0d; outline: 3px solid var(--tally); outline-offset: 0; overflow: hidden; }
.monitor.vert { width: auto; height: min(74vh, 900px); aspect-ratio: 9 / 16; }
@media (max-width: 1060px) { .monitor.vert { height: min(80vh, 760px); } }
.monitor iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: normal; }
.ghost { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.ghost .feed { position: absolute; inset: 0;
  background: linear-gradient(180deg, #6d8aa6 0%, #a9c0cc 44%, #7d8a57 45%, #59663a 70%, #3b4526 100%); }

.ghost .hole { position: absolute; display: grid; place-items: center; overflow: hidden; }
.ghost .hole.cam { background: radial-gradient(circle at 50% 35%, #56606e, #23282f 75%); }
.ghost .hole.cam svg { width: 46%; height: auto; fill: #7c8794; opacity: .55; margin-top: 18%; }
.ghost .hole.game { background: linear-gradient(180deg, #6d8aa6 0%, #a9c0cc 50%, #6c7a48 51%, #3b4526 100%); }
.ghost .lbl { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font: 600 26px var(--f); color: rgba(255,255,255,.75); background: rgba(0,0,0,.35); padding: 4px 12px; white-space: nowrap; }
.ghost .chat { position: absolute; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 6px; gap: 8px; overflow: hidden; }
.ghost .msg { background: rgba(0,0,0,.72); border-left: 4px solid var(--acc, #fff); padding: 10px 14px; }
.ghost .msg b { display: block; font-size: 18px; color: var(--acc, #fff); }
.ghost .msg span { font-size: 22px; color: var(--txt, #fff); }

.switcher { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
.key { appearance: none; border: 1px solid var(--line2); background: var(--raise); color: var(--text); border-radius: 4px; padding: 10px 14px;
  font-weight: 700; font-stretch: 85%; cursor: pointer; min-width: 92px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.key:hover { border-color: var(--muted); }
.key[aria-pressed="true"] { background: var(--tally); border-color: var(--tally); color: #fff; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; font-stretch: 92%; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.switcher .seg { margin-left: auto; }
.alerts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
.alerts span { margin-right: 4px; font-stretch: 90%; }

/* ---------- form ---------- */
.intro { padding: 22px 24px 6px; }
.intro details { border: 1px solid var(--line); border-radius: 8px; background: var(--raise); }
.intro summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-stretch: 105%; }
.intro .how { padding: 0 16px 14px; color: var(--muted); }
.intro .how p { margin: 0 0 10px; max-width: 62ch; }
.intro .how b { color: var(--text); font-weight: 600; }
section.grp { padding: 20px 24px 24px; border-bottom: 1px solid var(--line); }
section.grp h2 { margin: 0 0 4px; font-size: 21px; font-weight: 750; font-stretch: 112%; letter-spacing: -.005em; }
section.grp > p.hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; max-width: 58ch; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); font-stretch: 92%; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
input[type=text], input[type=number], input[type=password], textarea, select {
  width: 100%; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 9px 11px; min-width: 0; }
input:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 2px rgba(121,182,255,.25); }
textarea { resize: vertical; min-height: 92px; line-height: 1.45; }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--tally); }
.small-note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; max-width: 58ch; }
.warn { font-size: 13px; color: #ffd6a0; background: rgba(255,170,60,.09); border: 1px solid rgba(255,170,60,.3); border-radius: 6px; padding: 10px 12px; margin: 4px 0 14px; }

.themes { display: grid; gap: 8px; margin-bottom: 18px; }
.theme { appearance: none; text-align: left; display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; cursor: pointer; }
.theme:hover { border-color: var(--muted); }
.theme[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.theme .sw { width: 54px; height: 54px; border-radius: 6px; position: relative; overflow: hidden; }
.theme .sw i { position: absolute; }
.theme strong { display: block; font-weight: 700; font-stretch: 105%; }
.theme small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }

.colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.color { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 6px; }
.color input[type=color] { width: 34px; height: 34px; border: 0; padding: 0; background: none; border-radius: 4px; cursor: pointer; }
.color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color input[type=color]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,.2); border-radius: 4px; }
.color div { min-width: 0; }
.color b { display: block; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.color input[type=text] { padding: 2px 0; border: 0; background: transparent; font-size: 13px; font-variant-numeric: tabular-nums; }
.color input[type=text]:focus { box-shadow: none; }
@media (max-width: 480px) { .colors { grid-template-columns: 1fr 1fr; } }

.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.font { appearance: none; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 10px; cursor: pointer; text-align: left; }
.font[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.font .s { display: block; font-size: 24px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
.font small { color: var(--muted); font-size: 12px; }

.logo-drop { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; background: var(--ink); border: 1px dashed var(--line2); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.logo-drop .thumb { width: 96px; height: 60px; display: grid; place-items: center; border-radius: 4px; background: #000 repeating-conic-gradient(#1a1a1a 0 25%, #222 0 50%) 0 0/12px 12px; overflow: hidden; color: var(--muted); font-size: 12px; text-align: center; }
.logo-drop .thumb img { max-width: 100%; max-height: 100%; }
.logo-drop .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.logo-drop p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

.list { display: grid; gap: 8px; margin-bottom: 10px; }
.li { display: grid; grid-template-columns: 1fr 1.3fr auto auto; gap: 6px; align-items: center; }
.li.sp { grid-template-columns: 22px 1.4fr 1fr; }
.li .n { color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.icon-btn { appearance: none; border: 1px solid var(--line2); background: transparent; border-radius: 6px; width: 34px; height: 36px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--text); border-color: var(--muted); }
.star[aria-pressed="true"] { color: #ffc94a; border-color: #ffc94a; }
.corners { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 280px; margin-bottom: 14px; }
.corners button { appearance: none; border: 1px solid var(--line2); background: var(--ink); border-radius: 6px; padding: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.corners button[aria-pressed="true"] { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.endbar { padding: 24px; display: grid; gap: 12px; }
.endbar .btn.primary { width: 100%; padding: 14px; font-size: 16px; }
.top .status { max-width: 320px; text-align: right; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.status.ok { color: #8fe3a8; } .status.err { color: #ffb4a8; }
.foot { padding: 0 24px 28px; color: var(--muted); font-size: 13px; }
.only-yt, .only-tw { }
body.tw .only-yt, body.yt .only-tw { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="yt">
<header class="top">
  <div class="brand">
    <h1>Stream Pack Builder</h1>
    <p>Design your own OBS overlays and scenes, then download them ready to use. Built on the system <b>SHAHZON</b> uses on his own streams.</p>
  </div>
  <span class="status" id="status-top" role="status" aria-live="polite"></span>
  <button class="btn primary" id="dl-top" type="button">Download my pack</button>
</header>

<main class="app">
  <div class="stagecol">
    <div class="mon-head"><span class="tally">Preview</span><span class="res" id="res">1920 × 1080</span><span class="file" id="file">starting.html</span></div>
    <div class="monitor-wrap"><div class="monitor" id="monitor">
      <div class="ghost" id="under"></div>
      <iframe id="pv" title="Scene preview" sandbox="allow-scripts"></iframe>
      <div class="ghost" id="over"></div>
    </div></div>
    <div class="switcher" id="keys" role="group" aria-label="Scenes"></div>
    <div class="alerts">
      <span>Test an alert:</span>
      <button class="btn small" data-alert="sub" id="a-sub">New subscriber</button>
      <button class="btn small" data-alert="member" id="a-mem">Member</button>
      <button class="btn small" data-alert="superchat" id="a-sc">Super Chat</button>
      <button class="btn small" data-alert="tip">Tip</button>
    </div>
  </div>

  <div class="formcol" id="form"></div>
</main>
<script>
const PACK_JS = "/* Stream pack engine. You never need to edit this file.\n   Your details live in assets/config.js, live numbers in assets/live.js. */\n(function () {\n  const C = window.PACK || {};\n  const W8 = C.words || {};\n  const PREVIEW = !!window.PACK_PREVIEW;\n  const $ = (s, r = document) => r.querySelector(s);\n  const $$ = (s, r = document) => [...r.querySelectorAll(s)];\n  const hash = new URLSearchParams(location.hash.slice(1));\n  const TWITCH = C.platform === \"twitch\";\n\n  /* ---------- colours come from the CSS variables in pack.css ---------- */\n  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n  const col = () => ({ acc: css(\"--acc\"), acc2: css(\"--acc2\"), warm: css(\"--warm\"), bg: css(\"--bg\"), tint: css(\"--tint\"), text: css(\"--text\") });\n  function rgba(hex, a) {\n    hex = (hex || \"#ffffff\").replace(\"#\", \"\");\n    if (hex.length === 3) hex = [...hex].map(c => c + c).join(\"\");\n    const n = parseInt(hex, 16);\n    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;\n  }\n\n  /* ---------- scale the stage to any window ---------- */\n  function fit() {\n    const st = $(\".stage\"); if (!st) return;\n    const W = st.offsetWidth, H = st.offsetHeight;\n    const s = Math.min(innerWidth / W, innerHeight / H);\n    st.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`;\n  }\n  addEventListener(\"resize\", fit);\n\n  const dims = el => { const st = el.closest(\".stage\"); return [st.offsetWidth, st.offsetHeight]; };\n  const seeded = seed => { let s = seed * 9301 + 49297; return () => ((s = (s * 16807) % 2147483647) / 2147483647); };\n\n  function makeNoise(seed) {\n    const p = new Uint8Array(512), rnd = seeded(seed);\n    const perm = [...Array(256).keys()].sort(() => rnd() - .5);\n    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];\n    const g = i => (p[i] / 255) * 2 - 1, fade = t => t * t * (3 - 2 * t);\n <\/style>\n<\/head>\n<body>\n<!-- Live chat source.\n     Twitch: opens your popout chat straight away.\n     YouTube: waits until you are live, finds your stream, then opens its chat\n     (needs youtubeApiKey + channelId in config.js). Without a key, add your\n     stream's video id to the file path: chat.html#v=VIDEO_ID\n     Then paste assets/chat.css into this source's Custom CSS in OBS. -->\n<script src=\"assets/config.js\"><\/script>\n<script src=\"assets/pack.js\"><\/script>\n<script>\n  const C = Pack.C;\n  if (C.platform === \"twitch\") {\n    if (C.channel) location.replace(`https://www.twitch.tv/popout/${encodeURIComponent(C.channel)}/chat?popout=`);\n    else document.body.innerHTML = \"<p>Add your Twitch username as channel in assets/config.js<\/p>\";\n  } else {\n    const open = id => location.replace(`https://www.youtube.com/live_chat?is_popout=1&v=${id}`);\n    const manual = Pack.hash.get(\"v\");\n    if (manual) open(manual);\n    else {\n      const streaming = () => new Promise(res => {\n        const o = window.obsstudio;\n        if (!o || !o.getStatus) return res(true);\n        const t = setTimeout(() => res(true), 1500);\n        o.getStatus(st => { clearTimeout(t); res(!!(st && st.streaming)); });\n      });\n      async function check() { if (!(await streaming())) return; const id = await Pack.findLive(); if (id) open(id); }\n      check();\n      setInterval(check, 30000);\n    }\n  }\n<\/script>\n<\/body><\/html>\n", "chatting.html": "<!doctype html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Just Chatting<\/title>\n<link rel=\"stylesheet\" href=\"assets/pack.css\">\n<\/head>\n<body>\n<!-- OBS order (bottom to top): facecam, THIS, chat.html (inside the chat frame).\n     Facecam: x60 y170, 1180 x 664. Chat: x1290 y170, 570 x 870. -->\n<div class=\"stage\">\n  <canvas class=\"layer\" id=\"bg\"><\/canvas>\n  <div class=\"hdr\">\n    <img class=\"logo /* ===================== colour helpers ===================== */
const hexRgb = h => { h = (h || "#000").replace("#", ""); if (h.length === 3) h = [...h].map(c => c + c).join(""); const n = parseInt(h, 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const lum = h => { const [r, g, b] = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const onColor = h => lum(h) > .32 ? "#000000" : "#ffffff";
const darken = (h, k) => "#" + hexRgb(h).map(v => Math.round(v * k).toString(16).padStart(2, "0")).join("");
const js = v => JSON.stringify(v, null, 2).replace(/</g, "\\u003c");
const jsl = v => JSON.stringify(v).replace(/</g, "\\u003c");
const lit = o => "{ " + Object.entries(o).map(([k, v]) => `${k}: ${jsl(v)}`).join(", ") + " }";
const litList = a => a.length ? "[\n" + a.map(o => "    " + lit(o)).join(",\n") + "\n  ]" : "[]";
const strList = a => a.length ? "[\n" + a.map(v => "    " + jsl(v)).join(",\n") + "\n  ]" : "[]";
const litBlock = o => "{\n" + Object.entries(o).map(([k, v]) => `    ${k}: ${jsl(v)}`).join(",\n") + "\n  }";
const escH = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => (String(s || "my").normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "") || "My");
const logoExt = type => ({ "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg" }[type] || "png");

/* ===================== file generators ===================== */
function fontImport(S) { return `@import url("https://fonts.googleapis.com/css2?family=${FONTS[S.font].q}&display=swap");`; }

function packCSS(S) {
  const c = S.colors, f = FONTS[S.font] || FONTS.saira;

  return `${fontImport(S)}

/* =========================================================

   If you change --acc, --warm or --text, also update the matching -rgb line

   ========================================================= */
:root {
  --acc:  ${c.acc};    --acc-rgb: ${rgb(c.acc)};     /* main colour */
  --acc2: ${c.acc2};   /* second colour (gradients) */
  --warm: ${c.warm};   --warm-rgb: ${rgb(c.warm)};   /* money, goal, tip box */
  --bg:   ${c.bg};     /* background */

  --text: ${c.text};   --text-rgb: ${rgb(c.text)};

  --flare: #ff3b3b;

}

${PACK_CSS}${S.sharp ? `

*, *::before, *::after { border-radius: 0 !important; }
.live-dot, .live-badge i { border-radius: 50% !important; }

}

function buildFiles(S) {

  for (const [name, html] of Object.entries(SCENE_FILES)) files[name] = html;
  files["index.html"] = indexHTML(S);
  files["README.txt"] = readme(S);
  files["assets/config.js"] = configJS(S, false);
  files["assets/live.js"] = liveJS(S);
  files["assets/pack.js"] = PACK_JS;
  files["assets/pack.css"] = packCSS(S);
  files["assets/chat.css"] = chatCSS(S);
  if (S.logo) {
    const b64 = S.logo.split(",")[1] || "";
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    files[`assets/logo.${logoExt(S.logoType)}`] = u;
  }
  return files;
}

  });

  let pvT;
  function changed() { save(); clearTimeout(pvT); pvT = setTimeout(() => refresh(false), 350); }

  const CAM_SVG = `<svg viewBox="0 0 100 80" aria-hidden="true"><circle cx="50" cy="26" r="20"/><path d="M8 80c4-24 22-34 42-34s38 10 42 34z"/></svg>`;
  const CHAT_LINES = [["Simran", "that clutch was insane"], ["Rohit_OP", "bhai sensitivity settings?"], ["GhostAkm", "first time here, subbed"], ["Pixel Jatt", "GG"], ["Noob Master", "one more match please"], ["Aarav", "drop your ID in chat"]];
  function ghosts() {
    const f = sceneFile(), W = ui.vertical ? 1080 : 1920, H = ui.vertical ? 1920 : 1080;
    const under = $("#under"), over = $("#over");
    [under, over].forEach(g => { g.style.width = W + "px"; g.style.height = H + "px"; });
    const holes = HOLES[f] ? HOLES[f](S) : [];
    let u = "";
    if (f === "gameplay.html") u += `<div class="feed"><span class="lbl">Your game capture</span></div>`;
    u += holes.map(([x, y, w, h, l]) => `<div class="hole ${l}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${l === "cam" ? CAM_SVG + '<span class="lbl">Your facecam</span>' : '<span class="lbl">Your game capture</span>'}</div>`).join("");
    under.innerHTML = u;
    const cr = CHAT_RECT[f];
    over.style.setProperty("--acc", S.colors.acc); over.style.setProperty("--txt", S.colors.text);
    over.innerHTML = cr ? `<div class="chat" style="left:${cr[0]}px;top:${cr[1]}px;width:${cr[2]}px;height:${cr[3]}px;font-family:'${FONTS[S.font].ui}',sans-serif">${CHAT_LINES.map(([n, m]) => `<div class="msg" style="border-radius:${S.sharp ? 0 : 8}px"><b>${n}</b><span>${m}</span></div>`).join("")}</div>` : "";
    fitGhosts();
  }
  function fitGhosts() {
    const m = $("#monitor"), W = ui.vertical ? 1080 : 1920, s = m.clientWidth / W;
    $$(".ghost").forEach(g => g.style.transform = `scale(${s})`);
  }
  addEventListener("resize", fitGhosts);

  function refresh(sceneChanged) {
    const f = sceneFile();
    $("#monitor").classList.toggle("vert", ui.vertical);
    $("#res").textContent = ui.vertical ? "1080 × 1920" : "1920 × 1080";
    $("#file").textContent = f;
    ghosts();
    $("#pv").srcdoc = previewDoc(S, f);
    if (sceneChanged) requestAnimationFrame(fitGhosts);
  }
  $("#pv").addEventListener("load", () => {
    fitGhosts();
    if (ui.pendingAlert) { const a = ui.pendingAlert; ui.pendingAlert = null; setTimeout(() => fire(a), 700); }
  });

  const NAMES = ["Rohit_OP", "Simran", "GhostAkm", "Pixel Jatt", "Noob Master"];
  function fire(type) {
    const tw = S.platform === "twitch";
    const amount = type === "superchat" ? (tw ? "500 bits" : S.currency + "199") : type === "tip" ? S.currency + "100" : "";
    $("#pv").contentWindow.postMessage({ pack: "alert", type, name: NAMES[Math.floor(Math.random() * NAMES.length)], amount, msg: type === "superchat" ? "Next game, all in!" : type === "member" ? "" : "" }, "*");
  }
  $$("[data-alert]").forEach(b => b.addEventListener("click", () => {
    const type = b.dataset.alert;
    if (ui.scene === "gameplay" || ui.scene === "chatting") return fire(type);
    ui.scene = "gameplay"; ui.pendingAlert = type; renderKeys(); refresh(true);
  }));

  /* ---------------- download ---------------- */
  function status(t, cls) { ["#status", "#status-top"].forEach(id => { const s = $(id); if (!s) return; s.textContent = t; s.className = "status" + (cls ? " " + cls : ""); }); }
  let dlNS;
  const dlReady = (async () => { try { if (window.claude && window.claude.use) dlNS = await window.claude.use("downloads"); } catch {} })();
  async function download() {
    const btns = [$("#dl-top"), $("#dl-bottom")];
    if (!window.JSZip) { status("The zip tool didn't load. Check your connection and reload the page.", "err"); return; }
    btns.forEach(b => b.disabled = true); status("Packing your files…");
    try {
      const root = slug(S.name) + "StreamPack";
      const zip = new JSZip(), files = buildFiles(S);
      for (const [p, c] of Object.entries(files)) zip.file(root + "/" + p, c);
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      const filename = root + ".zip";
      await dlReady;
      if (dlNS) {
        try { await dlNS.save({ filename, data: blob }); status(`Saved ${filename}. Unzip it and open index.html for the OBS steps.`, "ok"); }
        catch (e) { status(e && e.code === "declined" ? "Download cancelled." : "The download didn't go through. Try again in a moment.", e && e.code === "declined" ? "" : "err"); }
      } else {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        status(`Downloading ${filename}. Unzip it and open index.html for the OBS steps.`, "ok");
      }
    } catch (e) { status("Something went wrong while packing. Reload the page and try again.", "err"); }
    btns.forEach(b => b.disabled = false);
  }
  $("#dl-top").addEventListener("click", () => { download(); });

  renderForm(); renderKeys(); refresh(true);
})();

</script>
</body></html>
