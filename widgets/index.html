<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stream Widgets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Orbitron:wght@800&family=Teko:wght@600&family=Rajdhani:wght@700&family=Fredoka:wght@600&family=Bungee&family=Pixelify+Sans:wght@700&family=Anton&family=Share+Tech+Mono&family=Nunito:wght@900&display=swap">
<style>
:root {
  --ink: #1c1f24; --panel: #24282e; --raise: #2d3239; --line: #3c424c; --line2: #4c5460;
  --text: #eef0f2; --muted: #a3abb6; --tally: #ff4b3e; --tally-dim: rgba(255,75,62,.16); --focus: #79b6ff;
  --f: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 15px/1.45 var(--f); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: #9fd0ff; }

.top { display: flex; align-items: center; gap: 16px 20px; padding: 18px clamp(16px, 3vw, 36px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; font-stretch: 125%; letter-spacing: -.01em; line-height: 1.05; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-stretch: 90%; max-width: 70ch; }
.brand p b { color: var(--text); font-weight: 600; }
.btn { appearance: none; display: inline-block; text-decoration: none; color: var(--text); border: 1px solid var(--line2); background: var(--raise); border-radius: 6px; padding: 9px 14px; font-weight: 600; cursor: pointer; font-stretch: 95%; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--text); color: var(--ink); border-color: var(--text); font-weight: 700; padding: 11px 18px; }
.btn.primary:hover { background: #fff; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 460px; align-items: start; }
.stagecol { position: sticky; top: 0; padding: 22px clamp(16px, 3vw, 36px); min-width: 0; }
.formcol { border-left: 1px solid var(--line); background: var(--panel); min-height: calc(100vh - 80px); }
@media (max-width: 1060px) { .app { grid-template-columns: 1fr; } .stagecol { position: static; } .formcol { border-left: 0; border-top: 1px solid var(--line); } }

.picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.key { appearance: none; border: 1px solid var(--line2); background: var(--raise); color: var(--text); border-radius: 4px; padding: 10px 14px;
  font-weight: 700; font-stretch: 85%; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); text-align: left; }
.key small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); font-stretch: 90%; }
.key:hover { border-color: var(--muted); }
.key[aria-pressed="true"] { background: var(--tally); border-color: var(--tally); color: #fff; }
.key[aria-pressed="true"] small { color: rgba(255,255,255,.85); }

.mon-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; font-stretch: 90%; flex-wrap: wrap; }
.tally { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--tally); }
.tally::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 0 3px var(--tally-dim); }
.mon-head .res { color: var(--muted); font-variant-numeric: tabular-nums; }
.monitor { position: relative; width: 100%; aspect-ratio: 16 / 9; outline: 3px solid var(--tally); overflow: hidden; display: grid; place-items: center; background: #0a0b0d; }
.monitor[data-bg="game"] { background: linear-gradient(180deg, #6d8aa6 0%, #a9c0cc 44%, #7d8a57 45%, #59663a 70%, #3b4526 100%); }
.monitor[data-bg="dark"] { background: #101216; }
.monitor[data-bg="light"] { background: #e9ecef; }
.monitor[data-bg="checker"] { background: #222 repeating-conic-gradient(#2c2c2c 0 25%, #1d1d1d 0 50%) 0 0/24px 24px; }
.monitor iframe { width: 88%; border: 0; background: transparent; color-scheme: normal; display: block; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; color: var(--muted); font-size: 13px; }
.ctrl .sp { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 11px; cursor: pointer; font-weight: 600; font-stretch: 92%; color: var(--muted); font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
.notice { margin-top: 12px; font-size: 13.5px; color: #ffd6a0; }

.tabs { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 0 2px; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px 0; }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--muted); padding: 9px 9px 11px; font-weight: 650; font-stretch: 92%; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--tally); }
.panel[hidden] { display: none; }
section.grp { padding: 20px 24px 24px; border-bottom: 1px solid var(--line); }
section.grp h2 { margin: 0 0 4px; font-size: 21px; font-weight: 750; font-stretch: 112%; letter-spacing: -.005em; }
section.grp > p.hint { margin: 0 0 16px; color: var(--muted); font-size: 14px; max-width: 58ch; }
h3.sub { margin: 18px 0 8px; font-size: 15px; font-weight: 700; font-stretch: 105%; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--muted); font-stretch: 92%; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type=text], input[type=number], input[type=url], input[type=time], textarea, select {
  width: 100%; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 9px 11px; min-width: 0; }
input:focus, textarea:focus, select:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 2px rgba(121,182,255,.25); }
.check { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
.check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--tally); flex: none; }
.small-note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; max-width: 58ch; }
.warn { font-size: 13px; color: #ffd6a0; background: rgba(255,170,60,.09); border: 1px solid rgba(255,170,60,.3); border-radius: 6px; padding: 10px 12px; margin: 4px 0 14px; }
.okbox { font-size: 13px; color: #b9f0c9; background: rgba(80,200,120,.08); border: 1px solid rgba(80,200,120,.3); border-radius: 6px; padding: 10px 12px; margin: 0 0 14px; }

.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin-bottom: 16px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opts button { appearance: none; border: 1px solid var(--line2); background: var(--ink); border-radius: 6px; padding: 9px 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--muted); text-align: center; }
.opts button:hover { color: var(--text); }
.opts button[aria-pressed="true"] { border-color: var(--text); color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.opts button small { display: block; font-weight: 500; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.range { display: grid; grid-template-columns: 1fr 52px; gap: 12px; align-items: center; margin-bottom: 14px; }
.range input { accent-color: var(--tally); width: 100%; }
.range output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; text-align: right; }

.skins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.skin { appearance: none; text-align: left; background: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; cursor: pointer; display: grid; gap: 8px; }
.skin:hover { border-color: var(--muted); }
.skin[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.skin .sw { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 17px; overflow: hidden; white-space: nowrap; }
.skin .sw i { flex: none; width: 18px; height: 18px; }
.skin .sw b { flex: 1; height: 6px; }
.skin strong { display: block; font-weight: 700; font-stretch: 105%; }
.skin small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.color { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 6px; }
.color input[type=color] { width: 34px; height: 34px; border: 0; padding: 0; background: none; border-radius: 4px; cursor: pointer; }
.color input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.color input[type=color]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,.2); border-radius: 4px; }
.color b { display: block; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.2; }
.color input[type=text] { padding: 2px 0; border: 0; background: transparent; font-size: 13px; font-variant-numeric: tabular-nums; }
.color input[type=text]:focus { box-shadow: none; }
.fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.font { appearance: none; background: var(--ink); border: 1px solid var(--line2); border-radius: 6px; padding: 10px; cursor: pointer; text-align: left; }
.font[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.font .s { display: block; font-size: 22px; line-height: 1.15; white-space: nowrap; overflow: hidden; }
.font small { color: var(--muted); font-size: 12px; }

.list { display: grid; gap: 8px; margin-bottom: 10px; }
.li { display: grid; grid-template-columns: 96px 1fr 1.3fr 34px; gap: 6px; align-items: center; }
.icon-btn { appearance: none; border: 1px solid var(--line2); background: transparent; border-radius: 6px; width: 34px; height: 38px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--text); border-color: var(--muted); }

.guide { border: 1px solid var(--line); border-radius: 6px; margin: -4px 0 14px; background: var(--ink); }
.guide summary { cursor: pointer; padding: 8px 12px; font-size: 13.5px; font-weight: 600; color: #9fd0ff; }
.guide ol { margin: 0; padding: 2px 14px 12px 32px; font-size: 13.5px; color: var(--muted); }
.guide li { margin-bottom: 6px; }
.guide li b { color: var(--text); font-weight: 600; }
.guide code { background: var(--panel); padding: 1px 5px; border-radius: 4px; color: var(--text); font-size: 12.5px; }
.guide .tipline { margin: 0; padding: 0 14px 12px; font-size: 12.5px; color: var(--muted); }
.test-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: -4px 0 14px; }
.test-out { font-size: 13.5px; color: var(--muted); }
.test-out.ok { color: #8fe3a8; } .test-out.err { color: #ffb4a8; }
.needs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.needs span { font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); }
.needs span.ok { border-color: rgba(80,200,120,.5); color: #8fe3a8; }
.needs span.miss { border-color: rgba(255,170,60,.5); color: #ffd6a0; }

.linkbox { width: 100%; min-height: 96px; resize: vertical; font: 12.5px/1.4 ui-monospace, Consolas, monospace; word-break: break-all; }
.steps { margin: 0 0 14px; padding-left: 22px; color: var(--muted); font-size: 14px; }
.steps li { margin-bottom: 8px; }
.steps b { color: var(--text); font-weight: 600; }
.steps code { background: var(--ink); padding: 1px 6px; border-radius: 4px; color: var(--text); font-size: 13px; }
.status { font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.status.ok { color: #8fe3a8; } .status.err { color: #ffb4a8; }
.foot { padding: 18px 24px 28px; color: var(--muted); font-size: 13px; }
body.tw .only-yt, body.yt .only-tw, [hidden] { display: none !important; }
.range.auto { grid-template-columns: 1fr 64px auto; }
.color.auto { grid-template-columns: 34px 1fr auto; }
.sample { background: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 12px 16px; margin: 0 0 14px; overflow: hidden; }
.sample b { display: block; font-size: 34px; line-height: 1.1; white-space: nowrap; }
.sample span { display: block; color: var(--muted); font-size: 16px; margin-top: 4px; }
textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.picker .key { min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="yt">
<header class="top">
  <div class="brand">
    <h1>Stream Widgets</h1>
    <p>Goal bars, live counters, timers, clocks, tickers and name plates for OBS. Pick one, make it yours, and paste the link into OBS. Made by <b>SHAHZON</b>.</p>
  </div>
  <a class="btn" href="../">Stream Pack Builder</a>
  <button class="btn primary" id="go-obs" type="button">Get my OBS link</button>
</header>

<main class="app">
  <div class="stagecol">
    <div class="picker" id="picker" role="group" aria-label="Widget"></div>
    <div class="mon-head"><span class="tally">Preview</span><span class="res" id="res"></span><span class="res" id="mode"></span></div>
    <div class="monitor" id="monitor" data-bg="game"><iframe id="pv" title="Widget preview"></iframe></div>
    <div class="ctrl">
      <span id="acts"></span>
      <span class="sp">Background</span>
      <div class="seg" id="bg" role="group" aria-label="Preview background">
        <button type="button" data-v="game">Game</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="light">Light</button><button type="button" data-v="checker">See-through</button>
      </div>
    </div>
    <label class="check" style="margin-top:12px" id="live-wrap"><input type="checkbox" id="live"><span>Show my real data in the preview (uses your keys)</span></label>
    <p class="notice" id="notice" hidden></p>
  </div>
  <div class="formcol" id="form"></div>
</main>

<script>
(function () {
  "use strict";
  /* Keep DEF in step with DEF inside w.html. New options: add them in both, with a default. */
  const DEF = {
    v: 1, type: "likes", platform: "youtube", handle: "", ch: "", poll: 20, locale: "en-IN",
    look: { skin: "neon", font: "orbitron", a: "#00e5ff", b: "#b14dff", t: "#ffffff", p: "#0a0718", po: .85, icon: true,
            r: "", anim: "none", idle: "none",
            text: { scale: 1, lab: { font: "", size: 1, w: "", i: "", ls: "", lh: "", tt: "", c: "" },
                    num: { font: "", size: 1, w: "", i: "", ls: "", lh: "", tt: "", c: "" },
                    ban: { font: "", size: 1, w: "", i: "", ls: "", lh: "", tt: "", c: "" },
                    fill: "solid", stroke: 0, strokeC: "#000000", shadow: "skin", shadowC: "#000000" } },
    fx: { style: "sparks", banner: true, sound: "chime", vol: .6, url: "" },
    w: {
      likes:   { label: "LIKE GOAL", start: 100, step: 100, big: "{goal} LIKES!", small: "Goal smashed! Next: {next}", hot: true },
      subs:    { label: "SUB GOAL", start: 1000, step: 100, exact: "", big: "{goal} SUBS!", small: "Welcome to the family! Next: {next}", hot: true },
      tips:    { tag: "TIP GOAL", title: "New mic", goal: 5000, step: 0, raised: 0, cur: "₹", tips: true, superchats: true, bits: false,
                 big: "GOAL REACHED!", small: "Thank you so much", hot: true },
      viewers: { label: "Watching", likes: true, likesLabel: "Likes" },
      timer:   { mode: "uptime", label: "Live for", minutes: 10, at: "21:00", done: "Starting now" },
      socials: { secs: 5, items: [
        { icon: "camera", label: "INSTAGRAM", value: "@yourname" },
        { icon: "chat", label: "DISCORD", value: "discord.gg/yourname" },
        { icon: "coin", label: "TIP / UPI", value: "yourname@upi" } ] },
      supporter: { secs: 6, sub: true, tip: true, top: true, subLabel: "Latest sub", tipLabel: "Latest tip", topLabel: "Top tip" },
      ticker:    { label: "NEWS", icon: "bolt", text: "Welcome to the stream!\nDrop a like if you're enjoying it\nFollow me on Instagram @yourname", speed: 120 },
      clock:     { label: "Local time", h12: true, secs: false, date: false, tz: "" },
      lower:     { name: "YOUR NAME", sub: "Playing BGMI tonight\nSquad up: drop your ID in chat", icon: "controller", secs: 6 },
      subcount:  { label: "Subscribers", pop: true }
    }
  };
  const TYPES = [
    ["likes", "Like goal", "YouTube"], ["subs", "Sub goal", "YouTube"], ["tips", "Tip goal", "Streamlabs"],
    ["viewers", "Viewers", "YouTube"], ["subcount", "Sub counter", "YouTube"], ["timer", "Timer", "No keys needed"], ["clock", "Clock", "No keys needed"],
    ["socials", "Socials", "No keys needed"], ["ticker", "Scrolling ticker", "No keys needed"], ["lower", "Name plate", "No keys needed"], ["supporter", "Supporters", "Streamlabs"]
  ];
  const SIZE = { likes: [800, 300], subs: [800, 300], tips: [800, 300], viewers: [560, 150], timer: [560, 150], socials: [760, 150], supporter: [800, 160],
    ticker: [1400, 140], clock: [560, 150], lower: [820, 190], subcount: [560, 150] };
  const NEEDS = { likes: ["yt"], subs: ["yt"], tips: ["sl"], viewers: ["yt"], timer: [], socials: [], supporter: ["sl"], ticker: [], clock: [], lower: [], subcount: ["yt"] };
  const YT_ONLY = ["likes", "subs", "viewers", "subcount"];
  /* every font you can pick, with the weights Google Fonts has ("a..b" = variable) */
  const FONT_LIB = [
    ["Gaming & display", [["Saira Condensed", "400;500;600;700;800;900"], ["Teko", "300..700"], ["Russo One", "400"], ["Anton", "400"], ["Orbitron", "400..900"],
      ["Bungee", "400"], ["Bebas Neue", "400"], ["Oswald", "200..700"], ["Black Ops One", "400"], ["Bangers", "400"], ["Audiowide", "400"], ["Staatliches", "400"],
      ["Big Shoulders Display", "100..900"], ["Barlow Condensed", "400;500;600;700;800;900"], ["Michroma", "400"], ["Squada One", "400"], ["Rubik Mono One", "400"],
      ["Archivo Black", "400"], ["Bowlby One", "400"], ["Kanit", "400;500;600;700;800;900"], ["Saira", "100..900"], ["Exo 2", "100..900"],
      ["Chakra Petch", "300;400;500;600;700"], ["Rajdhani", "300;400;500;600;700"], ["Quantico", "400;700"], ["Play", "400;700"],
      ["Bai Jamjuree", "200;300;400;500;600;700"], ["Titillium Web", "200;300;400;600;700;900"]]],
    ["Retro & pixel", [["Pixelify Sans", "400..700"], ["Press Start 2P", "400"], ["Silkscreen", "400;700"], ["VT323", "400"], ["Monoton", "400"], ["Share Tech Mono", "400"], ["JetBrains Mono", "100..800"]]],
    ["Fun & handwritten", [["Fredoka", "300..700"], ["Lilita One", "400"], ["Luckiest Guy", "400"], ["Righteous", "400"], ["Permanent Marker", "400"], ["Creepster", "400"],
      ["Pacifico", "400"], ["Lobster", "400"], ["Caveat", "400..700"], ["Dancing Script", "400..700"], ["Rowdies", "300;400;700"], ["Baloo 2", "400..800"]]],
    ["Clean & simple", [["Inter", "100..900"], ["Montserrat", "100..900"], ["Poppins", "100;200;300;400;500;600;700;800;900"], ["Sora", "100..800"], ["Nunito", "200..1000"],
      ["Rubik", "300..900"], ["Barlow", "100;200;300;400;500;600;700;800;900"], ["Space Grotesk", "300..700"], ["Archivo", "100..900"]]],
    ["Elegant", [["Cinzel", "400..900"], ["Playfair Display", "400..900"]]],
    ["Hindi friendly (Devanagari)", [["Hind", "300;400;500;600;700"], ["Mukta", "200;300;400;500;600;700;800"], ["Rozha One", "400"], ["Kalam", "300;400;700"], ["Yatra One", "400"]]]
  ];
  const FONT_W = Object.fromEntries(FONT_LIB.flatMap(([, l]) => l));
  const famQ = n => "family=" + n.replace(/ /g, "+") + (FONT_W[n] && FONT_W[n] !== "400" ? ":wght@" + FONT_W[n] : "");
  const fontWeights = n => { const w = FONT_W[n]; if (!w) return [100, 200, 300, 400, 500, 600, 700, 800, 900];
    if (w.includes("..")) { const [a, b] = w.split("..").map(Number), o = []; for (let x = Math.ceil(a / 100) * 100; x <= Math.min(900, b); x += 100) o.push(x); return o; }
    return w.split(";").map(Number); };
  const ROLES = [["lab", "Labels (small text, tags)"], ["num", "Main text and numbers"], ["ban", "Celebration text"]];
  const SKINS = {
    neon:     { label: "Neon", note: "Glowing outline", font: "orbitron", a: "#00e5ff", b: "#b14dff", t: "#ffffff", p: "#0a0718", po: .85 },
    blade:    { label: "Blade", note: "Sharp, angled esports card", font: "teko", a: "#e3121b", b: "#ff5a1f", t: "#ffffff", p: "#16080a", po: .92 },
    glass:    { label: "Glass", note: "Frosted and soft", font: "archivo", a: "#7cf5c8", b: "#5aa9ff", t: "#ffffff", p: "#0e1420", po: .6 },
    pixel:    { label: "Pixel", note: "Retro 8-bit blocks", font: "pixelify", a: "#ffd23f", b: "#3ddc84", t: "#ffffff", p: "#1b1b2f", po: 1 },
    clean:    { label: "Clean", note: "Simple and flat", font: "rajdhani", a: "#ff4757", b: "#ff7f50", t: "#ffffff", p: "#111318", po: .88 },

    terminal: { label: "Terminal", note: "Hacker console", font: "mono", a: "#00ffa3", b: "#00b3ff", t: "#e6fff6", p: "#020409", po: .88 },

    minimal:  { label: "Minimal", note: "Just the text, no card", font: "rajdhani", a: "#ffd23f", b: "#ff7f50", t: "#ffffff", p: "#000000", po: 0 }
  };
  const FONTS = { orbitron: ["Orbitron", 800], teko: ["Teko", 600], rajdhani: ["Rajdhani", 700], archivo: ["Archivo", 800], fredoka: ["Fredoka", 600],
    bungee: ["Bungee", 400], pixelify: ["Pixelify Sans", 700], anton: ["Anton", 400], mono: ["Share Tech Mono", 400], nunito: ["Nunito", 900] };
  const ICON_NAMES = [["camera", "Camera"], ["play", "Video"], ["chat", "Chat"], ["at", "@ handle"], ["globe", "Website"], ["coin", "Coin"], ["rupee", "Rupee"],
    ["controller", "Game"], ["heart", "Heart"], ["star", "Star"], ["bell", "Bell"], ["bolt", "Bolt"]];

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const escH = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  const merge = (d, v) => {
    if (Array.isArray(d)) return Array.isArray(v) ? v : d;
    if (d && typeof d === "object") { const o = { ...d }; if (v && typeof v === "object") for (const k in v) o[k] = k in d ? merge(d[k], v[k]) : v[k]; return o; }
    return v === undefined || v === null ? d : v;
  };

  /* ---------------- state (keys are kept apart and only saved if asked) ---------------- */
  const ST = "spw-builder:v1", KS = "spw-builder:keys";
  let S = (() => { try { const v = JSON.parse(localStorage.getItem(ST)); if (v) return merge(clone(DEF), v); } catch {} return clone(DEF); })();
  let K = (() => { try { const v = JSON.parse(localStorage.getItem(KS)); if (v) return { k: v.k || "", t: v.t || "", remember: true }; } catch {} return { k: "", t: "", remember: false }; })();
  const ui = { tab: "widget", bg: "game", live: false, role: "num" };
  let saveT;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(ST, JSON.stringify(S)); } catch {}
      try { if (K.remember) localStorage.setItem(KS, JSON.stringify({ k: K.k, t: K.t })); else localStorage.removeItem(KS); } catch {}
    }, 300);
  }
  const get = p => p.split(".").reduce((o, k) => o == null ? o : o[k], S);
  const set = (p, v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };
  const W = () => S.w[S.type];

  /* ---------------- the link ---------------- */
  const b64 = str => { const u = new TextEncoder().encode(str); let s = ""; u.forEach(c => s += String.fromCharCode(c)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  function cfgFor(type) {
    const w = { [type]: S.w[type] };
    if (type === "supporter") w.tips = { cur: S.w.tips.cur };
    return { v: 1, type, platform: S.platform, handle: S.handle, ch: S.ch, poll: S.poll, locale: S.locale, look: S.look, fx: S.fx, w };
  }
  const widgetURL = () => new URL("w.html", location.href).href;
  function hashFor(type, withKeys) {
    let h = "#c=" + b64(JSON.stringify(cfgFor(type)));
    if (withKeys) { if (K.k && (needs(type).includes("yt") || type === "timer")) h += "&k=" + encodeURIComponent(K.k); if (K.t && (needs(type).includes("sl") || type === "subs")) h += "&t=" + encodeURIComponent(K.t); }
    return h;
  }
  const needs = t => NEEDS[t] || [];
  function readLink(text) {
    const i = text.indexOf("#"); if (i < 0) return false;
    const h = new URLSearchParams(text.slice(i + 1));
    try {
      const s = (h.get("c") || "").replace(/-/g, "+").replace(/_/g, "/");
      const c = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s), ch => ch.charCodeAt(0))));
      const type = SIZE[c.type] ? c.type : "likes";
      const keepW = clone(S.w);
      S = merge(clone(DEF), { ...c, w: { ...keepW, ...(c.w || {}) } }); S.type = type;
      if (h.get("k")) K.k = h.get("k"); if (h.get("t")) K.t = h.get("t");
      return true;
    } catch { return false; }
  }

  /* ---------------- small form helpers ---------------- */
  const T = (k, label, ph = "", extra = "") => `<label class="field"><span>${label}</span><input type="text" data-k="${k}" placeholder="${escH(ph)}" ${extra}></label>`;

  const R = (k, label, min, max, step, fmt, def) => `<div class="field"><span>${label}</span></div><div class="range${def != null ? " auto" : ""}"><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" aria-label="${escH(label)}"${def != null ? ` data-def="${def}"` : ""}><output data-out="${k}" data-fmt="${fmt}"></output>${def != null ? `<button type="button" class="btn small" data-auto="${k}">Auto</button>` : ""}</div>`;
  const fmtOut = (v, f) => v === "" || v == null || (typeof v === "number" && isNaN(v)) ? "Auto" : f === "%" ? Math.round(v * 100) + "%" : f === "s" ? v + " s" : f === "px" ? v + " px" : f === "em" ? Number(v).toFixed(2) + " em" : f === "lh" ? Number(v).toFixed(2) : f === "sp" ? v + " px/s" : v;
  const CP = (k, label, auto) => `<div class="color${auto ? " auto" : ""}"><input type="color" data-kc="${k}" aria-label="${escH(label)}"><div><b>${label}</b><input type="text" data-kch="${k}" maxlength="7" aria-label="${escH(label)} hex"></div>${auto ? `<button type="button" class="btn small" data-auto="${k}">Auto</button>` : ""}</div>`;
  const fontOpts = def => `${def ? `<option value="">${def}</option>` : ""}${FONT_LIB.map(([g, l]) => `<optgroup label="${g}">${l.map(([n]) => `<option value="${n}">${n}</option>`).join("")}</optgroup>`).join("")}<option value="__any">Other Google font (type its name)…</option>`;
  const loaded = new Set();
  function loadFonts(names) {
    const need = names.filter(n => n && !loaded.has(n) && /^[\w .-]+$/.test(n)); if (!need.length) return;
    need.forEach(n => loaded.add(n));
    for (let i = 0; i < need.length; i += 20) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://fonts.googleapis.com/css2?" + need.slice(i, i + 20).map(famQ).join("&") + "&display=swap"; document.head.appendChild(l); }
  }
  const mainFam = () => FONTS[S.look.font] ? FONTS[S.look.font][0] : S.look.font;

  /* ---------------- widget settings, per type ---------------- */

        ${t === "subs" ? `${N(p + "exact", "Exact subscriber count right now (optional)", 'min="0" placeholder="From YouTube Studio"')}

        ${C(p + "hot", "Glow when the goal is close (85%)")}
        <h3 class="sub">Celebration text</h3>
        ${T(p + "big", "Big text")}${T(p + "small", "Line under it")}${textHelp}
      </section>`;
    if (t === "tips") return `
      <section class="grp"><h2>Tip goal</h2>

        <div class="row">${N(p + "goal", "Goal amount", 'min="1"')}${T(p + "cur", "Currency symbol", "₹")}</div>
        <div class="row">${N(p + "raised", "Already raised", 'min="0"')}${N(p + "step", "Next goal adds (0 = one goal)", 'min="0"')}</div>

        <h3 class="sub">Count these</h3>
        ${C(p + "tips", "Streamlabs tips")}
        <div class="only-yt">${C(p + "superchats", "Super Chats (added at face value, whatever the currency)")}</div>
        <div class="only-tw">${C(p + "bits", "Bits (100 bits = 1)")}</div>
        ${C(p + "hot", "Glow when the goal is close (85%)")}
        <h3 class="sub">Celebration text</h3>
        ${T(p + "big", "Big text")}${T(p + "small", "Line under it")}${textHelp}
      </section>`;
    if (t === "viewers") return `
      <section class="grp"><h2>Live viewers</h2>
        <p class="hint">Shows how many people are watching right now${W().likes ? ", plus likes" : ""}. Updates every ${S.poll} seconds while you're live.</p>
        ${T(p + "label", "Viewers label", "Watching")}
        ${C(p + "likes", "Also show likes")}
        ${W().likes ? T(p + "likesLabel", "Likes label", "Likes") : ""}
      </section>`;
    if (t === "timer") return `
      <section class="grp"><h2>Timer</h2>
        <p class="hint">Count up how long you've been live, or count down to the start.</p>
        ${opts(p + "mode", [["uptime", "Time live", "counts up"], ["minutes", "Countdown", "in minutes"], ["clock", "Count to", "a clock time"]], "three")}
        ${T(p + "label", "Label", "Live for")}
        ${W().mode === "minutes" ? N(p + "minutes", "Minutes", 'min="1" max="600"') : ""}
        ${W().mode === "clock" ? `<label class="field"><span>Start time</span><input type="time" data-k="${p}at"></label>` : ""}
        ${W().mode !== "uptime" ? T(p + "done", "Show this when it hits zero", "Starting now") : ""}
        ${W().mode === "uptime" ? `<p class="small-note">With your YouTube key it uses YouTube's real start time. Without it, it starts counting when OBS starts streaming (set Page permissions to "Read access to OBS status information").</p>` : ""}

    if (t === "socials") return `

      </section>`;
    if (t === "supporter") return `
      <section class="grp"><h2>Supporters</h2>
        <p class="hint">Takes turns showing your latest ${S.platform === "twitch" ? "follower" : "subscriber"}, latest tip and the biggest tip of the stream. New ones pop up straight away.</p>
        ${C(p + "sub", "Latest " + (S.platform === "twitch" ? "follower or sub" : "subscriber or member"))}
        ${W().sub ? T(p + "subLabel", "Label", "Latest sub") : ""}
        ${C(p + "tip", "Latest tip" + (S.platform === "twitch" ? " or bits" : " or Super Chat"))}
        ${W().tip ? T(p + "tipLabel", "Label", "Latest tip") : ""}
        ${C(p + "top", "Top tip of this stream")}
        ${W().top ? T(p + "topLabel", "Label", "Top tip") : ""}
        ${R(p + "secs", "Seconds each", 3, 20, 1, "s")}
        <p class="small-note">Top tip resets when OBS starts a new stream.</p>

        ${C(p + "h12", "12-hour clock (9:30 PM)")}

      </section>`;
    if (t === "ticker") return `

    if (t === "lower") return `
      <section class="grp"><h2>Name plate</h2>

        <label class="field"><span>Icon</span>${icons}</label>
        ${R(p + "secs", "Seconds per line", 2, 20, 1, "s")}
      </section>`;
    return "";
  }

  function textPanel() {
    const L = S.look, TX = L.text, r = ui.role, p = `look.text.${r}.`, o = TX[r];
    const rf = o.font || "", anyR = rf && !FONT_W[rf];
    const wf = rf || mainFam();

        <label class="field"><span>Or pick from all ${FONT_LIB.reduce((n, [, l]) => n + l.length, 0)} fonts</span><select id="main-font">${fontOpts("Choose a font…")}</select></label>

  function lookPanel() {

      const r = k === "cozy" ? "99px" : k === "glass" ? "14px" : k === "neon" || k === "comic" || k === "gradient" ? "8px" : k === "clean" ? "6px" : "0";

    if (a === "celebrate") post({ spw: "celebrate" });
    else if (a === "sub") post({ spw: "event", e: { kind: "sub", name: nm, id: "t" + Date.now() } });
    else { const amt = [99, 199, 500, 1000, 2000][Math.floor(Math.random() * 5)]; post({ spw: "event", e: { kind: "tip", name: nm, amount: amt, display: (S.w.tips.cur || "") + amt.toLocaleString(S.locale), id: "t" + Date.now() } }); }
  });
  $("#go-obs").addEventListener("click", () => { showTab("obs"); $("#form").scrollIntoView({ block: "start" }); });

  async function copyLink() {
    const t = $("#link").value, st = $("#copy-st");
    try { await navigator.clipboard.writeText(t); }
    catch { $("#link").select(); try { document.execCommand("copy"); } catch {} }
    st.textContent = "Copied. Paste it into the URL box in OBS."; st.className = "status ok";
  }

  /* ---------------- check a YouTube key ---------------- */
  async function testYT() {
    const out = $("#test-out"), btn = $("#test-yt");
    const say = (t, cls) => { out.textContent = t; out.className = "test-out" + (cls ? " " + cls : ""); };
    const key = K.k;
    if (!key) return say("Paste your API key first.", "err");
    if (!/^AIza[\w-]{30,}$/.test(key)) return say("That doesn't look like an API key. It starts with AIza and is about 39 characters.", "err");
    const ch = S.ch, handle = S.handle;
    if (!/^UC[\w-]{22}$/.test(ch || "") && !(handle || "").startsWith("@")) return say("Add your channel handle (like @yourname) first.", "err");
    btn.disabled = true; say("Checking…");
    try {
      const q = /^UC[\w-]{22}$/.test(ch || "") ? "id=" + encodeURIComponent(ch) : "forHandle=" + encodeURIComponent(handle);
      const d = await (await fetch(`https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&${q}&key=${encodeURIComponent(key)}`)).json();
      if (d.error) {
        const why = ((d.error.errors && d.error.errors[0] && d.error.errors[0].reason) || "") + " " + (d.error.message || "");
        if (/keyInvalid|API key not valid/i.test(why)) say("Google says this key isn't valid. Copy it again from Credentials, with no spaces.", "err");
        else if (/accessNotConfigured|SERVICE_DISABLED|has not been used|disabled/i.test(why)) say("The key works, but YouTube Data API v3 isn't switched on. Do step 3 (Enable), wait 2 minutes, test again.", "err");
        else if (/referer|blocked|restricted|API_KEY_/i.test(why)) say("The key is blocked by its restrictions. Set Application restrictions to None (step 6).", "err");
        else if (/quota/i.test(why)) say("This key has used up today's free limit. It resets at midnight Pacific time.", "err");
        else say("Google returned an error: " + (d.error.message || "unknown").slice(0, 140), "err");
      } else if (!d.items || !d.items.length) say("The key works, but no channel was found. Check your handle.", "err");
      else {
        const it = d.items[0];
        S.ch = it.id; changed();
        const subs = it.statistics && !it.statistics.hiddenSubscriberCount ? ` (${Number(it.statistics.subscriberCount).toLocaleString(S.locale)} subscribers)` : "";
        say(`It works! Connected to "${it.snippet.title}"${subs}.`, "ok");
      }
    } catch { say("Couldn't reach Google. Check your internet and try again.", "err"); }
    btn.disabled = false;
  }

  /* ---------------- start ---------------- */
  if (location.hash.includes("c=") && readLink(location.href)) history.replaceState(null, "", location.pathname);
  renderPicker(); renderForm(); bind(); preview();
})();
</script>
